packages:
  - e2e
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

catalogs:
  vite:
    '@vitejs/plugin-vue': ^6.0.11
    '@vitest/coverage-istanbul': ^5.1.1
    rolldown: ^1.3.3
    tsdown: ^0.23.7
    vite: ^8.3.8
    vitest: ^5.1.1
  vue:
    vue: ^3.5.46
    vue-router: ^5.5.1

minimumReleaseAgeExclude:
  - '@mdit-vue/*'
  - '@meteorlxy/*'
  - '@vuepress/*'
