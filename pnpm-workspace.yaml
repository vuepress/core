packages:
  - e2e
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

catalogs:
  vite:
    '@vitejs/plugin-vue': ^6.0.10
    '@vitest/coverage-istanbul': ^5.1.0
    rolldown: ^1.3.1
    tsdown: ^0.23.7
    vite: ^8.3.6
    vitest: ^5.1.0
  vue:
    vue: ^3.5.45
    vue-router: ^5.4.0

minimumReleaseAgeExclude:
  - '@vuepress/oxfmt-config'
  - '@vuepress/oxlint-config'
  - '@vuepress/tsconfig'
