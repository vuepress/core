name: release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to release branch
        run: git push origin HEAD:release

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Release check
        run: pnpm clean && pnpm build && pnpm check-types && pnpm lint && pnpm test:unit

      - name: Publish
        run: pnpm -r publish --no-git-checks --tag next

      - name: Create release changelog
        run: pnpx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
